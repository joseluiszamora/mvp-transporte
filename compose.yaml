services:
  transport-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${TRANSPORT_DB_NAME:-transport}
      POSTGRES_USER: ${TRANSPORT_DB_USER:-transport}
      POSTGRES_PASSWORD: ${TRANSPORT_DB_PASSWORD:-transport-local}
    ports:
      - "${TRANSPORT_DB_PORT:-5433}:5432"
    volumes:
      - transport-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TRANSPORT_DB_USER:-transport} -d ${TRANSPORT_DB_NAME:-transport}"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  transport-postgres:
